name: Demo CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          echo "No tests yet"

      # 👇 New Step
      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 👇 Modified Step
      - name: Build Docker Image
        run: |
          docker build -t demo-fastapi:$IMAGE_TAG ./app

      # 👇 New Step
      - name: Verify Docker Image
        run: |
          docker images